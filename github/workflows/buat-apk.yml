# =====================================================================
# Membuat APK di "awan" (server GitHub) — tidak perlu memasang apa pun di komputer.
# Jalankan lewat: tab Actions > "Buat APK" > Run workflow
# Hasilnya: file APK yang bisa diunduh di bagian "Artifacts" pada halaman proses tersebut.
# =====================================================================
name: Buat APK

# Kapan dijalankan: saat tombol "Run workflow" ditekan, atau saat ada file baru diunggah ke cabang main
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest          # komputer Linux milik GitHub (sudah ada Android SDK di dalamnya)
    steps:
      - name: Ambil isi proyek
        uses: actions/checkout@v4

      - name: Pasang Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pasang Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Bangun APK (memakai skrip buat-apk.js yang sama)
        run: node buat-apk.js

      - name: Simpan APK agar bisa diunduh
        uses: actions/upload-artifact@v4
        with:
          name: AsahOtakSeru-APK
          path: hasil/AsahOtakSeru.apk
